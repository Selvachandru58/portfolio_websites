<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hire Me</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#000;
    overflow:hidden;
}

h1{
    font-size:10rem;
    font-weight:900;
    text-transform:uppercase;
    color:#fff;
    letter-spacing:15px;
    animation: glow 2s ease-in-out infinite alternate,
               zoom 3s ease-in-out infinite;
}

@keyframes glow{
    from{
        text-shadow:
        0 0 10px #fff,
        0 0 20px #0077ff,
        0 0 40px #0077ff;
    }

    to{
        text-shadow:
        0 0 20px #fff,
        0 0 40px #0077ff,
        0 0 80px #0077ff;
    }
}

@keyframes zoom{
    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.15);
    }
}
</style>
</head>

<body>

<h1>HIRE ME...❤️</h1>

</body>
</html>
